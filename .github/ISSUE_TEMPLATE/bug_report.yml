name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue. Please provide enough detail to reproduce the migration behavior.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce.
      placeholder: |
        1. Run `/port-design-system-from-local-clone "<source-path>" "<target-path>" "<commit-hash>"`
        2. Wait for phase output
        3. Observe error...
    validations:
      required: true

  - type: input
    id: source-path
    attributes:
      label: Source Path
      description: Absolute local path used as source.
      placeholder: C:\\Users\\you\\Desktop\\Repositorios\\source-clone

  - type: input
    id: target-path
    attributes:
      label: Target Path
      description: Absolute local path used as target.
      placeholder: C:\\Users\\you\\Desktop\\Repositorios\\target-project

  - type: input
    id: commit-hash
    attributes:
      label: Commit Hash
      description: Baseline target commit hash used.
      placeholder: dc376a2cd4a33b9485f550fc8ae7a287f0041c96

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead? Include logs if possible.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Output of `node -v`.
      placeholder: v22.x.x
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any extra context, screenshots, or logs.
