name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the migration problem and proposal.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What migration or workflow problem does this solve?
      placeholder: I am blocked when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should the tool behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches you considered.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Local clone extraction
        - Legacy visual purge
        - Visual token migration
        - Animation and interaction parity
        - Asset pipeline
        - AI asset replacement prompts
        - Chrome DevTools MCP QA
        - Validation and QA
        - Documentation
        - Developer experience

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, links, constraints, or examples.
