#### MARQUEE / TICKER

```tsx
function Marquee({ children, speed = 40, direction = 'left' }: { children: React.ReactNode; speed?: number; direction?: 'left' | 'right' }) {
  return (
    <div className="overflow-hidden whitespace-nowrap">
      <div
