## 12. FASE 0.6 — INSPECCIÓN RAW SOURCE (BLOQUEANTE)

Ejecutar en MCP-REF en CADA página. Guardar en `docs/pds/extraction/raw-extraction-<page>.json`.

```javascript
(async () => {
  const data = {
    url: location.href,
    fullHTML: document.documentElement.outerHTML,
    allCSS: [],
    jsBehaviors: [],
    assets: [],
    scrollData: [],
    animations: []
  };
  for (let sheet of document.styleSheets) {
    try {
      if (sheet.href) {
        const css = await fetch(sheet.href).then(r => r.text()).catch(() => 'CORS_BLOCKED');
        data.allCSS.push({ href: sheet.href, content: css });
      } else if (sheet.cssRules) {
        let rules = '';
        for (let rule of sheet.cssRules) rules += rule.cssText + '\n';
        data.allCSS.push({ href: 'inline', content: rules });
      }
    } catch(e) {}
  }
  document.querySelectorAll('img,video,source,svg,audio').forEach(el => {
    if (el.src || el.currentSrc) data.assets.push(el.src || el.currentSrc);
  });
  const positions = Array.from({length: 21}, (_, i) => i * 0.05);
  for (let pos of positions) {
    window.scrollTo({ top: document.body.scrollHeight * pos, behavior: 'instant' });
    await new Promise(r => setTimeout(r, 150));
    data.scrollData.push({
      scrollPercent: pos * 100,
      visibleElements: Array.from(document.querySelectorAll('*'))
        .filter(el => el.getBoundingClientRect().height > 0).length
    });
  }
  window.scrollTo({ top: 0, behavior: 'instant' });
  console.dir(data);
  return data;
})();
```

Campos obligatorios: `url`, `fullHTML`, `allCSS`, `jsBehaviors`, `assets`, `scrollData`, `animations`.
Si falta algún campo: STOP + re-ejecutar.
Si CORS bloquea una hoja: ejecutar §13.2 (`fetchCrossOriginCSS`).

