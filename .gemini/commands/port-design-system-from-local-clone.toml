#### PARALLAX LAYERS

```tsx
useEffect(() => {
  const handleScroll = () => {
    const scrollY = window.scrollY;
    layers.forEach((layer) => {
      const el = document.querySelector(layer.selector);
      if (el instanceof HTMLElement) {
        el.style.transform = `translateY(${scrollY * layer.speed}px)`;
      }
